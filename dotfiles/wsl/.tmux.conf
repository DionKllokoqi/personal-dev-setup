# Ensure tmux advertises a 256-color/truecolor-capable terminal to shells.
set -g default-terminal "tmux-256color"

# Enable truecolor for common outer terminal TERM values.
set -as terminal-features ",xterm-256color:RGB,screen-256color:RGB,tmux-256color:RGB"

# Compatibility for tools/themes that still rely on the older Tc flag.
set -ga terminal-overrides ",xterm-256color:Tc,screen-256color:Tc,tmux-256color:Tc"
